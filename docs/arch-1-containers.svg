<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="arr-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>

  <!-- Title block -->
  <g>
    <text x="80" y="68" font-size="14" font-weight="600" fill="#6B7280" letter-spacing="2.5">FIGURA 1</text>
    <text x="80" y="112" font-size="32" font-weight="700" fill="#111827" letter-spacing="-0.6">Arquitetura de containers e integrações externas</text>
    <text x="80" y="144" font-size="17" font-weight="400" fill="#4B5563">Topologia de produção · Docker Compose orquestrando frontend, backend e banco de dados</text>
    <line x1="80" y1="172" x2="200" y2="172" stroke="#2D6A4F" stroke-width="3"/>
  </g>

  <!-- ============ EXTERNAL SERVICES ============ -->
  <g>
    <text x="800" y="232" text-anchor="middle" font-size="14" font-weight="600" fill="#6B7280" letter-spacing="2.5">SERVIÇOS EXTERNOS</text>

    <!-- Gemini -->
    <g>
      <rect x="560" y="252" width="320" height="120" rx="4" fill="#F9FAFB" stroke="#374151" stroke-width="2"/>
      <text x="720" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="#6B7280" letter-spacing="1.5">«EXTERNAL SYSTEM»</text>
      <text x="720" y="324" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Google Gemini API</text>
      <text x="720" y="354" text-anchor="middle" font-size="15" font-weight="400" fill="#4B5563">IA generativa · interpretação textual</text>
    </g>

    <!-- Earth Engine -->
    <g>
      <rect x="920" y="252" width="320" height="120" rx="4" fill="#F9FAFB" stroke="#374151" stroke-width="2"/>
      <text x="1080" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="#6B7280" letter-spacing="1.5">«EXTERNAL SYSTEM»</text>
      <text x="1080" y="324" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Google Earth Engine</text>
      <text x="1080" y="354" text-anchor="middle" font-size="15" font-weight="400" fill="#4B5563">NDVI · imagens de satélite</text>
    </g>
  </g>

  <!-- ============ DOCKER HOST ============ -->
  <g transform="translate(220, 480)">
    <rect x="0" y="0" width="1300" height="380" rx="6" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="8 5"/>

    <!-- Host label -->
    <g transform="translate(20, -16)">
      <rect x="0" y="0" width="280" height="32" fill="#FFFFFF"/>
      <text x="0" y="22" font-size="14" font-weight="600" fill="#374151" letter-spacing="2">DOCKER COMPOSE HOST</text>
    </g>

    <!-- Frontend container -->
    <g transform="translate(40, 50)">
      <rect x="0" y="0" width="380" height="280" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
      <text x="20" y="34" font-size="13" font-weight="600" fill="#6B7280" letter-spacing="1.5">«CONTAINER»</text>
      <text x="20" y="68" font-size="24" font-weight="700" fill="#111827">frontend</text>
      <text x="360" y="34" text-anchor="end" font-size="14" font-weight="600" fill="#374151" font-family="ui-monospace, 'SF Mono', Menlo, monospace">:80</text>
      <line x1="20" y1="84" x2="360" y2="84" stroke="#E5E7EB" stroke-width="1.5"/>

      <text x="20" y="124" font-size="17" font-weight="600" fill="#111827">Nginx</text>
      <text x="20" y="148" font-size="14" font-weight="400" fill="#4B5563">Reverse proxy</text>
      <text x="20" y="170" font-size="14" font-weight="400" fill="#4B5563">Serve a SPA estática</text>

      <line x1="20" y1="190" x2="360" y2="190" stroke="#E5E7EB" stroke-width="1"/>

      <text x="20" y="220" font-size="17" font-weight="600" fill="#111827">Vue 3 + Vite</text>
      <text x="20" y="244" font-size="14" font-weight="400" fill="#4B5563">Build estático otimizado</text>
    </g>

    <!-- Backend container (highlighted as core) -->
    <g transform="translate(460, 50)">
      <rect x="0" y="0" width="380" height="280" rx="4" fill="#F0F9F4" stroke="#2D6A4F" stroke-width="2.5"/>
      <text x="20" y="34" font-size="13" font-weight="600" fill="#2D6A4F" letter-spacing="1.5">«CONTAINER»</text>
      <text x="20" y="68" font-size="24" font-weight="700" fill="#111827">backend</text>
      <text x="360" y="34" text-anchor="end" font-size="14" font-weight="600" fill="#2D6A4F" font-family="ui-monospace, 'SF Mono', Menlo, monospace">:8000</text>
      <line x1="20" y1="84" x2="360" y2="84" stroke="#B7E4C7" stroke-width="1.5"/>

      <text x="20" y="124" font-size="17" font-weight="600" fill="#111827">FastAPI · Uvicorn</text>
      <text x="20" y="148" font-size="14" font-weight="400" fill="#4B5563">API REST assíncrona</text>
      <text x="20" y="170" font-size="14" font-weight="400" fill="#4B5563">Autenticação JWT · CORS</text>

      <line x1="20" y1="190" x2="360" y2="190" stroke="#B7E4C7" stroke-width="1"/>

      <text x="20" y="220" font-size="17" font-weight="600" fill="#111827">Domínio da aplicação</text>
      <text x="20" y="244" font-size="14" font-weight="400" fill="#4B5563">Clientes · propriedades · análises</text>
    </g>

    <!-- DB container with cylinder icon -->
    <g transform="translate(880, 50)">
      <rect x="0" y="0" width="380" height="280" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
      <text x="20" y="34" font-size="13" font-weight="600" fill="#6B7280" letter-spacing="1.5">«CONTAINER · DATABASE»</text>
      <text x="20" y="68" font-size="24" font-weight="700" fill="#111827">db</text>
      <text x="360" y="34" text-anchor="end" font-size="14" font-weight="600" fill="#374151" font-family="ui-monospace, 'SF Mono', Menlo, monospace">:5432</text>
      <line x1="20" y1="84" x2="360" y2="84" stroke="#E5E7EB" stroke-width="1.5"/>

      <!-- Cylinder icon -->
      <g transform="translate(20, 110)">
        <ellipse cx="32" cy="10" rx="32" ry="10" fill="#FFFFFF" stroke="#374151" stroke-width="1.8"/>
        <path d="M 0 10 L 0 80 A 32 10 0 0 0 64 80 L 64 10" fill="#FFFFFF" stroke="#374151" stroke-width="1.8"/>
        <ellipse cx="32" cy="10" rx="32" ry="10" fill="none" stroke="#374151" stroke-width="1.8"/>
        <ellipse cx="32" cy="34" rx="32" ry="10" fill="none" stroke="#9CA3AF" stroke-width="1"/>
        <ellipse cx="32" cy="58" rx="32" ry="10" fill="none" stroke="#9CA3AF" stroke-width="1"/>
      </g>

      <text x="108" y="138" font-size="17" font-weight="600" fill="#111827">PostgreSQL 16</text>
      <text x="108" y="162" font-size="14" font-weight="400" fill="#4B5563">Imagem Alpine</text>
      <text x="108" y="184" font-size="14" font-weight="400" fill="#4B5563">Volume persistente: pgdata</text>

      <text x="20" y="222" font-size="14" font-weight="400" fill="#4B5563">Healthcheck: pg_isready (5s)</text>
      <text x="20" y="244" font-size="14" font-weight="400" fill="#4B5563">Schema versionado via Alembic</text>
    </g>
  </g>

  <!-- ============ USER ACTOR (UML stick figure) ============ -->
  <g transform="translate(60, 580)">
    <!-- Stick figure -->
    <circle cx="60" cy="20" r="16" fill="none" stroke="#111827" stroke-width="2"/>
    <line x1="60" y1="36" x2="60" y2="86" stroke="#111827" stroke-width="2"/>
    <line x1="60" y1="50" x2="32" y2="68" stroke="#111827" stroke-width="2"/>
    <line x1="60" y1="50" x2="88" y2="68" stroke="#111827" stroke-width="2"/>
    <line x1="60" y1="86" x2="38" y2="118" stroke="#111827" stroke-width="2"/>
    <line x1="60" y1="86" x2="82" y2="118" stroke="#111827" stroke-width="2"/>
    <text x="60" y="148" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Usuário</text>
    <text x="60" y="170" text-anchor="middle" font-size="14" font-weight="400" fill="#4B5563">Navegador</text>
  </g>

  <!-- ============ CONNECTIONS ============ -->
  <!-- User → Frontend -->
  <line x1="180" y1="630" x2="258" y2="630" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
  <text x="219" y="618" text-anchor="middle" font-size="14" font-weight="500" fill="#111827">HTTPS</text>

  <!-- Frontend → Backend (proxy) -->
  <line x1="640" y1="640" x2="678" y2="640" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
  <text x="659" y="628" text-anchor="middle" font-size="13" font-weight="500" fill="#374151">proxy</text>
  <text x="659" y="664" text-anchor="middle" font-size="12" font-weight="400" fill="#6B7280">/api/v1</text>

  <!-- Backend → DB -->
  <line x1="1060" y1="640" x2="1098" y2="640" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1079" y="628" text-anchor="middle" font-size="13" font-weight="500" fill="#374151">SQL</text>

  <!-- Backend → Gemini (curved up) -->
  <path d="M 770 530 C 770 460, 720 410, 720 376" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="754" y="450" font-size="13" font-weight="500" fill="#374151">REST</text>

  <!-- Backend → Earth Engine (curved up-right) -->
  <path d="M 880 530 C 880 460, 1060 410, 1080 376" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="964" y="450" font-size="13" font-weight="500" fill="#374151">Python SDK</text>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(80, 920)">
    <text x="0" y="0" font-size="13" font-weight="600" fill="#6B7280" letter-spacing="2">LEGENDA</text>
    <line x1="0" y1="22" x2="32" y2="22" stroke="#111827" stroke-width="2" marker-end="url(#arr)"/>
    <text x="44" y="27" font-size="14" font-weight="500" fill="#111827">Chamada síncrona</text>

    <rect x="220" y="14" width="20" height="16" fill="#F0F9F4" stroke="#2D6A4F" stroke-width="2"/>
    <text x="248" y="27" font-size="14" font-weight="500" fill="#111827">Núcleo da aplicação</text>

    <rect x="430" y="14" width="20" height="16" fill="#F9FAFB" stroke="#374151" stroke-width="2"/>
    <text x="458" y="27" font-size="14" font-weight="500" fill="#111827">Sistema externo</text>

    <line x1="620" y1="22" x2="660" y2="22" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="672" y="27" font-size="14" font-weight="500" fill="#111827">Limite do host Docker</text>
  </g>

  <text x="1520" y="947" text-anchor="end" font-size="13" font-weight="500" fill="#6B7280">CultiveAI · v1.0</text>

</svg>
