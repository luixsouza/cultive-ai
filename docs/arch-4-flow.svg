<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
    <marker id="arr4-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-linejoin="round"/>
    </marker>
    <marker id="arr4-self" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2D6A4F"/>
    </marker>
  </defs>

  <rect width="1600" height="1500" fill="#FFFFFF"/>

  <!-- Title -->
  <g>
    <text x="80" y="68" font-size="14" font-weight="600" fill="#6B7280" letter-spacing="2.5">FIGURA 4</text>
    <text x="80" y="112" font-size="32" font-weight="700" fill="#111827" letter-spacing="-0.6">Fluxo de uma análise NDVI (diagrama de sequência)</text>
    <text x="80" y="144" font-size="17" font-weight="400" fill="#4B5563">Caso de uso completo · 12 mensagens · 7 atores</text>
    <line x1="80" y1="172" x2="200" y2="172" stroke="#2D6A4F" stroke-width="3"/>
  </g>

  <!-- Lifelines -->
  <g stroke="#D1D5DB" stroke-width="1" stroke-dasharray="3 5">
    <line x1="180" y1="340" x2="180" y2="1380"/>
    <line x1="380" y1="340" x2="380" y2="1380"/>
    <line x1="580" y1="340" x2="580" y2="1380"/>
    <line x1="800" y1="340" x2="800" y2="1380"/>
    <line x1="1020" y1="340" x2="1020" y2="1380"/>
    <line x1="1220" y1="340" x2="1220" y2="1380"/>
    <line x1="1420" y1="340" x2="1420" y2="1380"/>
  </g>

  <!-- Activation bar (FastAPI active during processing) -->
  <rect x="794" y="540" width="12" height="720" fill="#F0F9F4" stroke="#2D6A4F" stroke-width="1.5"/>

  <!-- Actor headers -->
  <g>
    <!-- User (UML stick figure inside box for compactness) -->
    <g transform="translate(120, 200)">
      <rect x="0" y="0" width="120" height="120" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
      <circle cx="60" cy="36" r="12" fill="none" stroke="#111827" stroke-width="1.8"/>
      <line x1="60" y1="48" x2="60" y2="78" stroke="#111827" stroke-width="1.8"/>
      <line x1="60" y1="58" x2="44" y2="68" stroke="#111827" stroke-width="1.8"/>
      <line x1="60" y1="58" x2="76" y2="68" stroke="#111827" stroke-width="1.8"/>
      <line x1="60" y1="78" x2="48" y2="98" stroke="#111827" stroke-width="1.8"/>
      <line x1="60" y1="78" x2="72" y2="98" stroke="#111827" stroke-width="1.8"/>
      <text x="60" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Usuário</text>
    </g>

    <g transform="translate(320, 200)">
      <rect x="0" y="0" width="120" height="120" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
      <text x="60" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="1.5">«FRONTEND»</text>
      <line x1="20" y1="58" x2="100" y2="58" stroke="#E5E7EB" stroke-width="1"/>
      <text x="60" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Vue SPA</text>
    </g>

    <g transform="translate(520, 200)">
      <rect x="0" y="0" width="120" height="120" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
      <text x="60" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="1.5">«PROXY»</text>
      <line x1="20" y1="58" x2="100" y2="58" stroke="#E5E7EB" stroke-width="1"/>
      <text x="60" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Nginx</text>
    </g>

    <g transform="translate(740, 200)">
      <rect x="0" y="0" width="120" height="120" rx="4" fill="#F0F9F4" stroke="#2D6A4F" stroke-width="2.5"/>
      <text x="60" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="#2D6A4F" letter-spacing="1.5">«CORE»</text>
      <line x1="20" y1="58" x2="100" y2="58" stroke="#B7E4C7" stroke-width="1"/>
      <text x="60" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">FastAPI</text>
    </g>

    <g transform="translate(960, 200)">
      <rect x="0" y="0" width="120" height="120" rx="4" fill="#F9FAFB" stroke="#374151" stroke-width="2"/>
      <text x="60" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="1.5">«EXTERNAL»</text>
      <line x1="20" y1="58" x2="100" y2="58" stroke="#E5E7EB" stroke-width="1"/>
      <text x="60" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Earth</text>
      <text x="60" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Engine</text>
    </g>

    <g transform="translate(1160, 200)">
      <rect x="0" y="0" width="120" height="120" rx="4" fill="#F9FAFB" stroke="#374151" stroke-width="2"/>
      <text x="60" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="1.5">«EXTERNAL»</text>
      <line x1="20" y1="58" x2="100" y2="58" stroke="#E5E7EB" stroke-width="1"/>
      <text x="60" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Gemini</text>
    </g>

    <g transform="translate(1360, 200)">
      <rect x="0" y="0" width="120" height="120" rx="4" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
      <text x="60" y="42" text-anchor="middle" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="1.5">«DATABASE»</text>
      <line x1="20" y1="58" x2="100" y2="58" stroke="#E5E7EB" stroke-width="1"/>
      <text x="60" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">PostgreSQL</text>
      <ellipse cx="60" cy="100" rx="22" ry="6" fill="none" stroke="#374151" stroke-width="1.2"/>
      <path d="M 38 100 L 38 110 A 22 6 0 0 0 82 110 L 82 100" fill="none" stroke="#374151" stroke-width="1.2"/>
    </g>
  </g>

  <!-- ============ MESSAGES ============ -->
  <g font-family="'Inter', system-ui">
    <!-- 01 -->
    <g>
      <text x="60" y="406" font-size="14" font-weight="700" fill="#111827">01</text>
      <line x1="180" y1="400" x2="378" y2="400" stroke="#111827" stroke-width="2" marker-end="url(#arr4)"/>
      <text x="280" y="390" text-anchor="middle" font-size="14" font-weight="500" fill="#111827">seleciona propriedade · período</text>
    </g>

    <!-- 02 -->
    <g>
      <text x="60" y="486" font-size="14" font-weight="700" fill="#111827">02</text>
      <line x1="380" y1="480" x2="578" y2="480" stroke="#111827" stroke-width="2" marker-end="url(#arr4)"/>
      <text x="480" y="470" text-anchor="middle" font-size="14" font-weight="500" fill="#111827">POST /api/v1/analysis · JWT</text>
    </g>

    <!-- 03 -->
    <g>
      <text x="60" y="566" font-size="14" font-weight="700" fill="#111827">03</text>
      <line x1="580" y1="560" x2="794" y2="560" stroke="#111827" stroke-width="2" marker-end="url(#arr4)"/>
      <text x="687" y="550" text-anchor="middle" font-size="14" font-weight="500" fill="#111827">proxy → :8000</text>
    </g>

    <!-- 04 self-call -->
    <g>
      <text x="60" y="646" font-size="14" font-weight="700" fill="#2D6A4F">04</text>
      <path d="M 806 640 C 870 640, 870 672, 806 672" fill="none" stroke="#2D6A4F" stroke-width="2" marker-end="url(#arr4-self)"/>
      <text x="876" y="660" font-size="14" font-weight="500" fill="#2D6A4F">deps.py · valida JWT</text>
    </g>

    <!-- 05 -->
    <g>
      <text x="60" y="726" font-size="14" font-weight="700" fill="#111827">05</text>
      <line x1="806" y1="720" x2="1018" y2="720" stroke="#111827" stroke-width="2" marker-end="url(#arr4)"/>
      <text x="912" y="710" text-anchor="middle" font-size="14" font-weight="500" fill="#111827">requisita NDVI · geometria</text>
    </g>

    <!-- 06 return -->
    <g>
      <text x="60" y="806" font-size="14" font-weight="700" fill="#6B7280">06</text>
      <line x1="1020" y1="800" x2="806" y2="800" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr4-open)"/>
      <text x="912" y="790" text-anchor="middle" font-size="14" font-weight="500" fill="#374151">série temporal NDVI</text>
    </g>

    <!-- 07 -->
    <g>
      <text x="60" y="886" font-size="14" font-weight="700" fill="#111827">07</text>
      <line x1="806" y1="880" x2="1218" y2="880" stroke="#111827" stroke-width="2" marker-end="url(#arr4)"/>
      <text x="1012" y="870" text-anchor="middle" font-size="14" font-weight="500" fill="#111827">prompt + dados NDVI</text>
    </g>

    <!-- 08 return -->
    <g>
      <text x="60" y="966" font-size="14" font-weight="700" fill="#6B7280">08</text>
      <line x1="1220" y1="960" x2="806" y2="960" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr4-open)"/>
      <text x="1012" y="950" text-anchor="middle" font-size="14" font-weight="500" fill="#374151">laudo interpretado</text>
    </g>

    <!-- 09 -->
    <g>
      <text x="60" y="1046" font-size="14" font-weight="700" fill="#111827">09</text>
      <line x1="806" y1="1040" x2="1418" y2="1040" stroke="#111827" stroke-width="2" marker-end="url(#arr4)"/>
      <text x="1112" y="1030" text-anchor="middle" font-size="14" font-weight="500" fill="#111827">INSERT analyses</text>
    </g>

    <!-- 10 return -->
    <g>
      <text x="60" y="1126" font-size="14" font-weight="700" fill="#6B7280">10</text>
      <line x1="1420" y1="1120" x2="806" y2="1120" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr4-open)"/>
      <text x="1112" y="1110" text-anchor="middle" font-size="14" font-weight="500" fill="#374151">analysis_id</text>
    </g>

    <!-- 11 return -->
    <g>
      <text x="60" y="1206" font-size="14" font-weight="700" fill="#6B7280">11</text>
      <line x1="794" y1="1200" x2="382" y2="1200" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr4-open)"/>
      <text x="588" y="1190" text-anchor="middle" font-size="14" font-weight="500" fill="#374151">200 OK · relatório JSON</text>
    </g>

    <!-- 12 return -->
    <g>
      <text x="60" y="1286" font-size="14" font-weight="700" fill="#6B7280">12</text>
      <line x1="380" y1="1280" x2="182" y2="1280" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr4-open)"/>
      <text x="280" y="1270" text-anchor="middle" font-size="14" font-weight="500" fill="#374151">renderiza mapa · PDF</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(80, 1430)">
    <text x="0" y="0" font-size="13" font-weight="600" fill="#6B7280" letter-spacing="2">LEGENDA</text>

    <line x1="0" y1="22" x2="36" y2="22" stroke="#111827" stroke-width="2" marker-end="url(#arr4)"/>
    <text x="48" y="27" font-size="14" font-weight="500" fill="#111827">Chamada síncrona</text>

    <line x1="220" y1="22" x2="256" y2="22" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr4-open)"/>
    <text x="268" y="27" font-size="14" font-weight="500" fill="#111827">Resposta</text>

    <line x1="370" y1="22" x2="406" y2="22" stroke="#2D6A4F" stroke-width="2" marker-end="url(#arr4-self)"/>
    <text x="418" y="27" font-size="14" font-weight="500" fill="#111827">Self-call</text>

    <rect x="510" y="14" width="14" height="16" fill="#F0F9F4" stroke="#2D6A4F" stroke-width="1.5"/>
    <text x="532" y="27" font-size="14" font-weight="500" fill="#111827">Activation FastAPI</text>
  </g>
  <text x="1520" y="1457" text-anchor="end" font-size="13" font-weight="500" fill="#6B7280">duração típica · 3 a 8 segundos</text>
</svg>
