<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
